name: upload
on:
  push:
    paths: ['uploads/*.json']
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: pip install requests
      - name: Upload new request files
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          for f in $(git diff --name-only HEAD~1 HEAD -- 'uploads/*.json'); do python scripts/yt_upload.py "$f"; done
      - name: Commit result
        if: always()
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add inbox-upload || true
          git commit -m "upload result" || true
          git pull --rebase || true
          git push || true
