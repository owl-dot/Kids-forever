name: fetch-assets
on:
  push:
    paths: ['requests/*.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download and prepare files
        continue-on-error: true
        run: |
          set -u
          for req in requests/*.json; do
            name=$(jq -r '.name' "$req")
            [ -f "inbox/$name/status.txt" ] && continue
            mkdir -p "inbox/$name"
            st="inbox/$name/status.txt"
            : > "$st"
            film=$(jq -r '.film_url // empty' "$req")
            audio=$(jq -r '.audio_url // empty' "$req")
            ps=$(jq -r '.peertube_search // empty' "$req")
            if [ -n "$ps" ]; then
              curl -sSL -G "https://video.blender.org/api/v1/search/videos" --data-urlencode "search=$ps" --data-urlencode "count=30" -o /tmp/ps.json
              jq -r '.data[]? | "\(.shortUUID) \(.uuid) dur=\(.duration) lic=\(.licence.label) \(.name)"' /tmp/ps.json >> "$st" 2>&1
              jq -r '.data[]? | select(.duration<400) | .uuid' /tmp/ps.json | head -0
            fi
            pt=$(jq -r '.peertube_id // empty' "$req")
            if [ -n "$pt" ]; then
              curl -sSL "https://video.blender.org/api/v1/videos/$pt" -o /tmp/pt.json
              jq -r '.files[]?, (.streamingPlaylists[]?.files[]?) | "\(.resolution.id) \(.fileDownloadUrl // .fileUrl)"' /tmp/pt.json >> "$st" 2>&1
              url=$(jq -r '[.files[]?, (.streamingPlaylists[]?.files[]?)] | map(select(.fileUrl|test("mp4$"))) | sort_by(.resolution.id) | last | .fileUrl' /tmp/pt.json)
              echo "chosen=$url" >> "$st"
              [ -n "$url" ] && [ "$url" != "null" ] && film="$url"
            fi
            yt=$(jq -r '.youtube_url // empty' "$req")
            if [ -n "$yt" ]; then
              pip install -q -U yt-dlp >> "$st" 2>&1
              yt-dlp -f "bv*[height<=1080]+ba/b[height<=1080]" --merge-output-format mp4 -o /tmp/film_raw.mp4 "$yt" >> "$st" 2>&1 && film="file:///tmp/film_raw.mp4" && echo "yt ok" >> "$st" || echo "yt failed" >> "$st"
            fi
            if [ -n "$film" ]; then
              code=$(curl -sSL -A "Mozilla/5.0" -o /tmp/film_raw -w '%{http_code}' "$film" || echo curlfail)
              [ "${film#file://}" != "$film" ] && code=200
              echo "film http=$code bytes=$(stat -c%s /tmp/film_raw 2>/dev/null || echo 0)" >> "$st"
              if [ "$code" = "200" ]; then
                ffmpeg -nostdin -loglevel error -y -i /tmp/film_raw -vf "scale='min(1280,iw)':-2" -c:v libx264 -crf 23 -maxrate 1500k -bufsize 3000k -preset medium -pix_fmt yuv420p -c:a aac -b:a 160k -movflags +faststart "inbox/$name/film.mp4" 2>> "$st" \
                  && echo "film ok bytes=$(stat -c%s inbox/$name/film.mp4)" >> "$st" || echo "film ffmpeg failed" >> "$st"
              fi
            fi
            if [ -n "$audio" ]; then
              code=$(curl -sSL -o "inbox/$name/narr.mp3" -w '%{http_code}' "$audio" || echo curlfail)
              echo "audio http=$code bytes=$(stat -c%s inbox/$name/narr.mp3 2>/dev/null || echo 0)" >> "$st"
              [ "$code" = "200" ] || rm -f "inbox/$name/narr.mp3"
            fi
          done
      - name: Commit results
        if: always()
        run: |
          git config user.name "fetch-bot"
          git config user.email "fetch-bot@users.noreply.github.com"
          git add inbox
          git diff --cached --quiet || git commit -m "fetched assets"
          git pull --rebase origin main
          git push origin HEAD:main
