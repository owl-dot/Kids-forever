.bub:after{content:"";position:absolute;bottom:-26px;width:0;height:0;border:16px solid transparent}
#bm{background:#fff;color:#1b2147}

#bh{background:#FF7A59;color:#fff}

#steps{top:1340px}
.step{display:inline-flex;align-items:center;gap:22px;margin:12px 0;padding:18px 40px 18px 18px;background:rgba(15,22,60,.82);border:3px solid rgba(255,255,255,.18);border-radius:60px;font-size:46px;font-weight:700;color:#fff;opacity:0}
.num{width:72px;height:72px;border-radius:50%;background:#2AD4C0;color:#0d1230;display:flex;align-items:center;justify-content:center;font-size:42px}
#mac{top:1780px;font-size:38px;font-weight:700;color:#FFD34D;opacity:0}
#end{top:0;height:1920px;background:radial-gradient(circle at 50% 45%,rgba(13,18,48,.55),rgba(13,18,48,.92));opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.keys{display:flex;gap:22px;align-items:center;font-size:70px;font-weight:700}

.plus{color:#FFD34D}
#end .t1{margin-top:70px;font-size:58px;font-weight:700}
#end .t2{margin-top:26px;font-size:46px;font-weight:700;color:#2AD4C0}
#end .t3{margin-top:60px;font-size:40px;font-weight:500;color:#cfd6ff}
